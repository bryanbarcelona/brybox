[project]
name = "brybox"
version = "0.10.0"
description = "Brybox is a personal automation toolkit for PC organization. It streamlines repetitive tasks such as PDF sorting, photo and video organization, and email/download handling. Designed to replace tedious manual workflows, Brybox provides a flexible, extensible framework for managing digital clutter with ease."
readme = "README.md"
authors = [
    { name = "Bryan Barcelona", email = "131413239+bryanbarcelona@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.5",
    "pdfplumber>=0.11.7",
    "playwright>=1.55.0",
    "pyexiftool>=0.5.6",
    "pyotp>=2.9.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.1",
    "pytz>=2025.2",
    "requests>=2.32.5",
    "rich>=14.1.0",
    "timezonefinder>=8.0.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.10.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]


[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ty.src]
include = ["src/", "tests/"]
exclude = [".venv/"]


[tool.ruff]
preview = true
line-length = 120
target-version = "py312"
extend-exclude = ["legacy", "main.py", "tetst_env_resetter.py", "CHANGELOG.md", "first_run.py"]
fix = true

lint.select = [
  "E", "W", "F", "I", "UP", "B", "C4", "S", "BLE", "FBT",
  "A", "C90", "T10", "ISC", "ICN", "G", "PIE", "T20",
  "PT", "Q", "RUF", "SIM", "TID", "ARG", "PTH", "ERA",
  "PL", "TRY", "ANN",  #  keep ANN, drop TCH/PYI
]
lint.ignore = [
  "line-too-long", "single-line-implicit-string-concatenation", "missing-trailing-comma", "assert",
  "too-many-arguments", "magic-value-comparison", "raise-vanilla-args", "any-type",
  "bad-quotes-inline-string", "avoidable-escaped-quote", "print", "ambiguous-unicode-character-comment", "boolean-type-hint-positional-argument",
  "non-empty-init-module", "global-statement", "missing-return-type-special-method",
  # TEMPORARY - tracked in CLAUDE.md as required follow-up work, do not let this linger:
  "too-many-statements-in-try-clause", "noqa-comments",
]

[tool.ruff.lint.isort]
known-first-party = ["brybox"]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["missing-type-function-argument", "missing-return-type-undocumented-public-function", "import-private-name", "pytest-parametrize-names-wrong-type", "no-self-use"]
"src/brybox/utils/settings.py" = ["missing-type-args", "missing-type-kwargs", "unused-static-method-argument"]
"src/brybox/core/snap_jedi/converter.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"src/brybox/core/videosith/converter.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"src/brybox/core/videosith/metadata_writer.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"src/brybox/core/porter/shared/metadata_fixers.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]

[tool.ty.rules]
invalid-return-type = "error"

[tool.pip-audit]
exclude = ["brybox"]


[tool.commitizen]
version_provider = "uv"
tag_format = "v${version}"
major_version_zero = true
bump_message = "chore(release): $current_version → $new_version"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

